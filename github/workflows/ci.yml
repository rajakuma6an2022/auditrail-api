name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auditrail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auditrail_test
      # dummy values so `prisma validate` / `generate` can read the schema
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auditrail_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/auditrail_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npm run db:generate
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Apply migrations to the test database
        run: npx prisma migrate deploy
      - run: npm run test:integration
      - run: npm run build
